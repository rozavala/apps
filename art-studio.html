<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Art Studio 🎨</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/art-studio.css?v=6">
  <link rel="stylesheet" href="css/copy-the-master.css?v=3">
  <link rel="stylesheet" href="css/zs-theme.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7C3AED">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="as-body">
  <div class="app as-app">
    <!-- Top navigation managed by nav.js -->
    <div class="screen active" id="screen-studio">
      <header class="as-head">
        <h1 class="as-title"><span id="as-logo" class="as-logo-wrap" aria-hidden="true"></span><span>Art Studio</span></h1>
        <nav class="as-tabs" role="tablist" aria-label="Art Studio">
          <button type="button" class="as-tab active" role="tab" aria-selected="true" data-tab="draw"><span data-ico="draw"></span><b>Draw</b></button>
          <button type="button" class="as-tab" role="tab" aria-selected="false" data-tab="learn"><span data-ico="learn"></span><b>Learn</b></button>
          <button type="button" class="as-tab" role="tab" aria-selected="false" data-tab="gallery"><span data-ico="gallery"></span><b>Gallery</b></button>
          <button type="button" class="as-tab" role="tab" aria-selected="false" data-tab="master"><span data-ico="master"></span><b>Masters</b></button>
        </nav>
      </header>

      <main class="as-panes">
        <section id="tab-draw" class="as-pane active" aria-label="Draw">
          <div id="draw-host" class="as-kit-host"></div>
        </section>

        <section id="tab-learn" class="as-pane" aria-label="Learn">
          <div id="learn-list" class="as-scroll"></div>
          <div id="learn-play" class="as-learn-play" hidden></div>
        </section>

        <section id="tab-gallery" class="as-pane" aria-label="Gallery">
          <div id="gallery-wall" class="wall as-scroll"></div>
        </section>

        <section id="tab-master" class="as-pane" aria-label="Copy the Master">
          <div id="cm-wrap"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- Save Dialog Overlay -->
  <div id="save-dialog" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="save-h">
    <div class="modal-card">
      <h3 id="save-h">Hang it in your gallery</h3>
      <div class="fr fr-gold fr-sm"><span class="fr-mould"><span class="fr-mat"><img id="save-preview" alt="Your artwork"></span></span></div>
      <label for="art-title" class="save-label">Give it a title</label>
      <input type="text" id="art-title" placeholder="My Masterpiece" maxlength="20" autocomplete="off">
      <div class="modal-btns">
        <button type="button" class="modal-btn" onclick="ArtStudio.closeSaveDialog()">Cancel</button>
        <button type="button" class="modal-btn primary" onclick="ArtStudio.confirmSave()">Save ✓</button>
      </div>
    </div>
  </div>

  <!-- Gallery Viewer Overlay -->
  <div id="gallery-viewer" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <div class="viewer-card">
      <button type="button" class="viewer-close" aria-label="Close the picture" onclick="ArtStudio.closeViewer()">✕</button>
      <div class="viewer-frame fr fr-gold"><span class="fr-mould"><span class="fr-mat"><img id="viewer-img" src="" alt="Artwork"></span></span></div>
      <div class="fr-plaque viewer-plaque"><b id="viewer-title">Title</b><span id="viewer-date"></span></div>
      <button type="button" id="viewer-delete" class="viewer-delete">Take it down (delete)</button>
    </div>
  </div>

  <!-- Common Feedback Overlay -->
  <div id="feedback" class="feedback-float"><span></span></div>

  <script src="js/auth.js?v=14"></script>
  <script src="js/off-hours.js?v=1"></script>

  <script src="js/a11y.js"></script>
  <script src="js/sync.js?v=26"></script>
  <script src="js/zs-diag.js?v=3"></script>
  <script src="js/nav.js?v=4"></script>
  <script src="js/sounds.js"></script>
  <script src="js/timer.js?v=3"></script>
  <script src="js/activity-log.js"></script>
  <script src="js/learning-checks.js?v=5"></script>
  <script src="js/dialog.js?v=3"></script>
  <script src="js/tts.js?v=3"></script>
  <script src="js/speak.js?v=2"></script>
  <script src="js/zs-canvas.js?v=1"></script>
  <script src="js/art-studio-brushes.js?v=2"></script>
  <script src="js/art-studio-art.js?v=1"></script>
  <script src="js/art-studio.js?v=7"></script>
  <script src="js/copy-the-master.js?v=3"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
