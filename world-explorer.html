<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Explorer 🌍</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/world-explorer.css?v=3">
  <link rel="stylesheet" href="css/zs-theme.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7C3AED">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body>
  <div class="atmo" style="width:400px;height:400px;background:rgba(59,130,246,0.08);top:-100px;left:-100px;"></div>
  <div class="atmo" style="width:350px;height:350px;background:rgba(16,185,129,0.06);bottom:-80px;right:-80px;animation-delay:-8s;"></div>

  <div class="app we-app">
    <!-- SCREEN: EXPLORE (world map → continent) -->
    <div class="screen active" id="screen-select">
      <div class="we-top">
        <div class="we-brand">
          <svg class="we-logo" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#7cc1e6"/><path d="M9,14c3-3 7-4 9-2s-1,5 2,7 6-1 7,3-3,7-6,8-6-2-7-5-6-4-5-11Z" fill="#9dd48b"/><path d="M27,9c3,1 6,4 6,7-2,0-4-2-6-1s-2-4 0-6Z" fill="#9dd48b"/><circle cx="20" cy="20" r="18" fill="none" stroke="#3a7fb0" stroke-width="2"/></svg>
          <h1 id="we-title">World Explorer</h1>
        </div>
        <div class="we-top-right">
          <span class="exp-stars" id="world-stars">⭐ 0</span>
          <button type="button" class="lang-toggle" onclick="WorldExplorer.toggleLanguage()" aria-label="Switch language / Cambiar idioma">
            <span id="lang-label">EN</span> 🌐
          </button>
        </div>
      </div>

      <div class="we-stage world" id="we-stage">
        <div class="we-stage-hud">
          <button type="button" class="back-btn we-stage-back" id="we-stage-back" aria-label="Back to the world map" onclick="WorldExplorer.backToSelect()" hidden>←</button>
          <div class="we-stage-titles">
            <div class="we-stage-title" id="we-stage-title">Pick a continent</div>
            <div class="we-stage-hint" id="we-stage-hint">Tap the map to fly there</div>
          </div>
        </div>
        <div class="we-stage-map" id="we-stage-map"></div>
      </div>

      <div id="we-below"></div>

      <h2 class="we-section" id="we-ch-title">Map challenges</h2>
      <div class="we-challenges" id="we-challenges"></div>
    </div>

    <!-- SCREEN: COUNTRY DETAIL -->
    <div class="screen" id="screen-country">
      <div class="country-card" id="country-card">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- SCREEN: QUIZ -->
    <div class="screen" id="screen-quiz">
      <div class="quiz-wrap" id="quiz-wrap">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- SCREEN: MAP CHALLENGE -->
    <div class="screen" id="screen-challenge">
      <div class="we-ch-bar">
        <button type="button" class="back-btn" aria-label="Quit challenge" onclick="WorldExplorer.quitChallenge()">←</button>
        <div class="we-ch-head"><div class="we-ch-name" id="we-ch-name"></div><div class="we-ch-count" id="we-ch-count"></div></div>
        <div class="we-ch-score" id="we-ch-score"></div>
      </div>
      <div class="we-progress"><span id="we-ch-fill"></span></div>
      <div class="we-ch-body">
        <div class="we-ch-prompt" id="we-ch-prompt"></div>
        <div class="we-ch-stage" id="we-ch-stage"><div class="we-stage-map" id="we-ch-map"></div></div>
        <div class="we-ch-side">
          <div class="we-ch-feedback" id="we-ch-feedback" aria-live="polite"></div>
          <div class="quiz-options we-ch-options" id="we-ch-options"></div>
          <button type="button" class="action-btn btn-primary we-ch-next" id="we-ch-next" hidden>Next →</button>
        </div>
      </div>
    </div>

    <!-- SCREEN: RESULTS -->
    <div class="screen" id="screen-results">
      <div class="results-wrap" id="results-wrap"></div>
    </div>
  </div>

  <div class="feedback" id="feedback"><span class="feedback-emoji" id="feedbackEmoji"></span></div>

  <script src="js/auth.js?v=10"></script>
  <script src="js/off-hours.js?v=1"></script>

  <script src="js/a11y.js"></script>
  <script src="js/dialog.js?v=3"></script>
  <script src="js/tts.js?v=3"></script>
  <script src="js/speak.js?v=2"></script>
  <script src="js/sync.js?v=22"></script>
  <script src="js/zs-diag.js?v=3"></script>
  <script src="js/nav.js?v=4"></script>
  <script src="js/sounds.js"></script>
  <script src="js/timer.js?v=3"></script>
  <script src="js/activity-log.js"></script>
  <script src="js/learning-checks.js?v=5"></script>
  <script src="js/world-atlas-data.js"></script>
  <script src="js/world-map-data.js?v=1"></script>
  <script src="js/world-explorer-art.js?v=1"></script>
  <script src="js/world-explorer.js?v=5"></script>
  <script src="js/world-explorer-extras.js"></script>
  <script src="js/pwa.js"></script>

</body>
</html>
