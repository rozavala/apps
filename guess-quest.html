<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess Quest 🎯</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/guess-quest.css?v=2">
  <link rel="stylesheet" href="css/zs-theme.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7C3AED">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body>
  <div class="atmo" style="width:400px;height:400px;background:rgba(251,191,36,0.08);top:-100px;left:-100px;"></div>
  <div class="atmo" style="width:350px;height:350px;background:rgba(239,68,68,0.06);bottom:-80px;right:-80px;animation-delay:-8s;"></div>

  <div class="app">
    <!-- SCREEN: Category Select -->
    <div class="screen active" id="screen-select">
      <div class="gq-header gq-hero">
        <div class="gq-hero-scene gq-scene" id="gq-hero-scene" aria-hidden="true"></div>
        <div class="gq-hero-title">
          <h1>Guess Quest</h1>
          <p id="gq-sub">I'm thinking of something... ask questions and drive closer!</p>
        </div>
        <button type="button" class="lang-toggle" onclick="GuessQuest.toggleLanguage()" aria-label="Switch language / Cambiar idioma">
          <span id="lang-label">EN / ES</span> 🌐
        </button>
      </div>

      <div class="gq-trip-log" id="gq-trip-log"></div>

      <!-- Daily Word entry point -->
      <button type="button" class="dw-daily-card" onclick="GuessQuest.openDaily()">
        <span class="dw-dc-emoji" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="40" height="40"><rect x="3" y="3" width="34" height="34" rx="6" fill="#1d4ed8" stroke="#fff" stroke-width="2.5"/><rect x="9" y="11" width="9" height="9" rx="1.5" fill="#fbbf24"/><rect x="22" y="11" width="9" height="9" rx="1.5" fill="#10b981"/><rect x="9" y="23" width="9" height="9" rx="1.5" fill="#fff"/><rect x="22" y="23" width="9" height="9" rx="1.5" fill="#fbbf24"/></svg>
        </span>
        <span class="dw-dc-body">
          <span class="dw-dc-title" id="gq-daily-title">Daily Word · Palabra del Día</span>
          <span class="dw-dc-sub" id="gq-daily-sub">One puzzle a day. Guess the word in 6 tries.</span>
        </span>
        <span class="dw-dc-arrow" aria-hidden="true">➜</span>
      </button>

      <h2 class="gq-route-title" id="gq-route-title">Pick a route</h2>
      <div class="category-grid" id="category-grid">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- SCREEN: Game (questions) -->
    <div class="screen" id="screen-game">
      <div class="game-header">
        <button type="button" class="back-btn" aria-label="Go back" onclick="GuessQuest.backToSelect()">←</button>
        <div class="question-counter" id="question-counter">0 / 20</div>
        <div class="gq-stars" id="gq-stars">⭐ 3</div>
      </div>

      <!-- Road scene: the car drives closer as the clues narrow it down -->
      <div class="gq-scene gq-scene-game" id="gq-scene"></div>

      <!-- Highway clue board -->
      <div class="gq-sign" id="gq-clues" aria-live="polite"></div>

      <!-- Hidden word letter tiles -->
      <div class="gq-tiles" id="gq-tiles"></div>

      <!-- Question categories -->
      <div class="question-categories" id="question-categories">
        <!-- Populated by JS: category groups with question buttons -->
      </div>

      <!-- Guess button (always visible) -->
      <div class="guess-bar">
        <button type="button" class="action-btn btn-guess" onclick="GuessQuest.showGuessScreen()">
          💡 <span id="gq-guess-btn-label">I want to guess!</span>
        </button>
      </div>
    </div>

    <!-- SCREEN: Guess (pick from candidates) -->
    <div class="screen" id="screen-guess">
      <div class="guess-header">
        <button type="button" class="back-btn" id="gq-guess-back" aria-label="Go back" onclick="GuessQuest.backToGame()">←</button>
        <h2 id="gq-guess-title">What do you think it is?</h2>
        <p id="gq-guess-sub"></p>
      </div>
      <div class="guess-grid" id="guess-grid">
        <!-- Populated by JS: candidate postcards -->
      </div>
    </div>

    <!-- SCREEN: Results -->
    <div class="screen" id="screen-results">
      <div class="results-wrap" id="results-wrap"></div>
    </div>
  </div>

  <div class="feedback" id="feedback"><span class="feedback-emoji" id="feedbackEmoji"></span></div>

  <script src="js/auth.js?v=15"></script>
  <script src="js/off-hours.js?v=1"></script>

  <script src="js/a11y.js"></script>
  <script src="js/dialog.js?v=3"></script>
  <script src="js/tts.js?v=3"></script>
  <script src="js/speak.js?v=2"></script>
  <script src="js/sync.js?v=28"></script>
  <script src="js/zs-diag.js?v=3"></script>
  <script src="js/nav.js?v=4"></script>
  <script src="js/sounds.js"></script>
  <script src="js/timer.js?v=3"></script>
  <script src="js/activity-log.js"></script>
  <script src="js/learning-checks.js?v=5"></script>
  <script src="js/guess-quest-art.js?v=1"></script>
  <script src="js/guess-quest.js?v=3"></script>
  <script src="js/daily-word.js?v=2"></script>
  <script src="js/pwa.js"></script>

</body>
</html>
