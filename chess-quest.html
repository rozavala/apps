<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Quest ♟️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/chess-quest.css?v=2">
  <link rel="stylesheet" href="css/zs-theme.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7C3AED">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body>
<div class="atmo atmo-1"></div>
<div class="atmo atmo-2"></div>
<div class="app">

  <!-- MODE SELECT -->
  <div class="screen active" id="screen-menu">
    <div class="menu-wide">
      <div class="cq-hero" id="cqHero"></div>
      <div class="mode-header">
        <h1>Chess Quest</h1>
        <p>Learn, practice, and play!</p>
        <div class="greeting" id="greeting"></div>
      </div>
      <div class="cq-stats" id="cqStats"></div>
      <div class="mode-grid">
        <button type="button" class="mode-card" onclick="openLearn()">
          <span class="m-icon" data-piece="wP" aria-hidden="true"></span>
          <span>
            <span class="m-title" style="display:block">Learn the Pieces</span>
            <span class="m-desc" style="display:block">Watch each piece move, then try it — plus castling, en passant and promotion.</span>
            <span class="m-badge rec" id="learnBadge"></span>
          </span>
        </button>
        <button type="button" class="mode-card" onclick="openPuzzleMenu()">
          <span class="m-icon dark" data-piece="wN" aria-hidden="true"></span>
          <span>
            <span class="m-title" style="display:block">Puzzles</span>
            <span class="m-desc" style="display:block">Climb the ladder: checkmates, forks, pins, skewers and more.</span>
            <span class="m-badge prog" id="puzzleBadge"></span>
          </span>
        </button>
        <button type="button" class="mode-card" onclick="openPlay()">
          <span class="m-icon" data-piece="bK" aria-hidden="true"></span>
          <span>
            <span class="m-title" style="display:block">Play vs Computer</span>
            <span class="m-desc" style="display:block">Five friendly levels and a coach who helps after mistakes.</span>
            <span class="m-badge prog" id="playBadge"></span>
          </span>
        </button>
        <button type="button" class="mode-card" onclick="ChessExtras.Rush.open()">
          <span class="m-icon dark" data-piece="wQ" aria-hidden="true"></span>
          <span>
            <span class="m-title" style="display:block">Puzzle Rush</span>
            <span class="m-desc" style="display:block">How many tactics can you solve in 3 minutes?</span>
            <span class="m-badge prog" id="rushBadge"></span>
          </span>
        </button>
        <button type="button" class="mode-card" onclick="ChessExtras.Openings.open()">
          <span class="m-icon" data-piece="bB" aria-hidden="true"></span>
          <span>
            <span class="m-title" style="display:block">Openings Primer</span>
            <span class="m-desc" style="display:block">Nine classic openings, played out on the board.</span>
            <span class="m-badge prog" id="openingsBadge"></span>
          </span>
        </button>
        <button type="button" class="mode-card" onclick="ChessExtras.Trainer.open()">
          <span class="m-icon dark" data-piece="wR" aria-hidden="true"></span>
          <span>
            <span class="m-title" style="display:block">Movement Trainer</span>
            <span class="m-desc" style="display:block">Tap the valid path to reach the target square.</span>
            <span class="m-badge prog" id="trainerBadge"></span>
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- MOVEMENT TRAINER -->
  <div class="screen" id="screen-trainer">
    <div id="trainer-wrap"></div>
  </div>

  <!-- PUZZLE RUSH -->
  <div class="screen" id="screen-puzzle-rush">
    <div id="rush-wrap"></div>
  </div>

  <!-- OPENINGS PRIMER -->
  <div class="screen" id="screen-openings">
    <div id="openings-wrap"></div>
  </div>

  <!-- LEARN: lesson list -->
  <div class="screen" id="screen-learn">
    <div class="menu-wide">
      <div class="cq-head"><button type="button" class="back-btn" aria-label="Go back" onclick="goMenu()">←</button><h2>Learn the Pieces<span class="cq-sub">Watch, then try it yourself</span></h2></div>
      <div class="learn-sec">The pieces</div>
      <div class="piece-grid" id="pieceGrid"></div>
      <div class="learn-sec">Special moves</div>
      <div class="piece-grid special-grid" id="specialGrid"></div>
    </div>
  </div>

  <!-- LEARN: one lesson -->
  <div class="screen" id="screen-lesson">
    <div class="cq-head"><button type="button" class="back-btn" aria-label="Back to lessons" onclick="openLearn()">←</button><span id="lessonIcon" style="width:40px;height:40px;flex-shrink:0" aria-hidden="true"></span><h2 id="lessonTitle"></h2></div>
    <div class="split">
      <div>
        <div class="board-wrap"><div class="board" id="learnBoard"></div></div>
        <div class="demo-cap" id="demoCap" aria-live="polite"></div>
      </div>
      <div class="side">
        <div class="lesson-info cq-card" id="lessonInfo"></div>
        <div class="tool-row">
          <button type="button" class="tool" onclick="Lesson.replay()"><span class="ti" aria-hidden="true">▶</span>Watch again</button>
          <button type="button" class="tool" onclick="Lesson.startTry()"><span class="ti" aria-hidden="true">✋</span>Try it</button>
          <button type="button" class="tool" onclick="Lesson.resetTry()" aria-label="Start the try-it board over"><span class="ti" aria-hidden="true">↺</span>Start over</button>
        </div>
        <div class="btn-row"><button type="button" class="btn btn-outline" onclick="openLearn()">All lessons</button><button type="button" class="btn btn-gold" id="lessonNextBtn" onclick="nextLesson()">Next lesson →</button></div>
      </div>
    </div>
  </div>

  <!-- PUZZLE LADDER -->
  <div class="screen" id="screen-puzzle-menu">
    <div class="menu-wide">
      <div class="cq-head"><button type="button" class="back-btn" aria-label="Go back" onclick="goMenu()">←</button><h2>Puzzle Ladder<span class="cq-sub">Each puzzle unlocks the next</span></h2></div>
      <div class="ladder-top cq-card" id="ladderTop"></div>
      <div id="ladderChapters"></div>
    </div>
  </div>

  <!-- PUZZLE -->
  <div class="screen" id="screen-puzzle">
    <div class="cq-head"><button type="button" class="back-btn" aria-label="Back to the puzzle ladder" onclick="openPuzzleMenu()">←</button><h2 id="puzzleLabel"></h2><span class="pill" id="puzzleTag"></span></div>
    <div class="split">
      <div>
        <div class="pz-goal" id="puzzleGoal"></div>
        <div class="board-wrap"><div class="board" id="puzzleBoard"></div></div>
      </div>
      <div class="side">
        <div class="coach" id="puzzleCoach" aria-live="polite"></div>
        <div class="puzzle-feedback" id="puzzleFeedback"></div>
        <div class="tool-row">
          <button type="button" class="tool" id="pzHintBtn" onclick="puzzleHint()"><span class="ti" aria-hidden="true">💡</span>Hint</button>
          <button type="button" class="tool" onclick="resetPuzzle()"><span class="ti" aria-hidden="true">↺</span>Restart</button>
          <button type="button" class="tool" onclick="flipPuzzle()" aria-label="Flip the board"><span class="ti" aria-hidden="true">⇅</span>Flip</button>
        </div>
        <div class="btn-row"><button type="button" class="btn btn-outline" onclick="openPuzzleMenu()">Ladder</button><button type="button" class="btn btn-gold" id="nextPuzzleBtn" onclick="nextPuzzle()" style="display:none">Next puzzle →</button></div>
      </div>
    </div>
  </div>

  <!-- PLAY: choose a level -->
  <div class="screen" id="screen-play-setup">
    <div class="menu-wide">
      <div class="cq-head"><button type="button" class="back-btn" aria-label="Go back" onclick="goMenu()">←</button><h2>Play vs Computer<span class="cq-sub">Pick an opponent</span></h2></div>
      <div class="opt-row cq-card"><label for="coachToggle">Coach on<small>Warns you when a move leaves a piece in danger, and lets you take it back.</small></label><input type="checkbox" class="switch" id="coachToggle"></div>
      <div class="opt-row cq-card" style="margin-bottom:14px"><label for="sideToggle">Play as Black<small>The computer moves first and the board turns around.</small></label><input type="checkbox" class="switch" id="sideToggle"></div>
      <div class="learn-sec">Choose your opponent</div>
      <div class="level-grid" id="levelGrid"></div>
    </div>
  </div>

  <!-- PLAY -->
  <div class="screen" id="screen-play">
    <div class="cq-head"><button type="button" class="back-btn" aria-label="Quit the game" onclick="goMenu()">←</button><h2 class="play-status" id="playStatus" aria-live="polite">Your move</h2></div>
    <div class="split">
      <div>
        <div class="player-bar" id="oppBar"><span class="pb-face" id="oppFace" aria-hidden="true"></span><span class="pb-name" id="oppName"></span><span class="captured-row" id="capOpp" aria-label="Pieces you have lost"></span><span class="pb-turn" id="oppTurn">Its move</span></div>
        <div class="board-wrap" id="playBoardWrap"><div class="board" id="playBoard"></div></div>
        <div class="player-bar bottom" id="youBar"><span class="pb-face light" id="youFace" aria-hidden="true"></span><span class="pb-name" id="youName"></span><span class="captured-row" id="capYou" aria-label="Pieces you have captured"></span><span class="pb-turn">Your move</span></div>
      </div>
      <div class="side">
        <div class="coach" id="playCoach" aria-live="polite" style="display:none"></div>
        <div id="gameOverWrap"></div>
        <div class="tool-row">
          <button type="button" class="tool" id="playHintBtn" onclick="playHint()"><span class="ti" aria-hidden="true">💡</span>Hint</button>
          <button type="button" class="tool" id="takebackBtn" onclick="takeBack()"><span class="ti" aria-hidden="true">↩</span>Take back</button>
          <button type="button" class="tool" onclick="flipPlay()" aria-label="Flip the board"><span class="ti" aria-hidden="true">⇅</span>Flip</button>
        </div>
        <div class="btn-row"><button type="button" class="btn btn-outline" onclick="goMenu()">Quit</button><button type="button" class="btn btn-gold" onclick="openPlay()">New game ♟️</button></div>
      </div>
    </div>
  </div>
</div>
<div class="feedback-float" id="feedback" aria-hidden="true"><span id="feedbackEmoji"></span></div>

<script src="js/auth.js?v=14"></script>
<script src="js/off-hours.js?v=1"></script>

<script src="js/a11y.js"></script>
<script src="js/sync.js?v=26"></script>
<script src="js/zs-diag.js?v=3"></script>
<script src="js/nav.js?v=4"></script>
<script src="js/sounds.js"></script>
<script src="js/timer.js?v=3"></script>
<script src="js/activity-log.js"></script>
<script src="js/learning-checks.js?v=5"></script>
<script src="js/dialog.js?v=3"></script>
<script src="js/tts.js?v=3"></script>
<script src="js/speak.js?v=2"></script>
<script src="js/chess-quest-art.js?v=1"></script>
<script src="js/chess-quest-data.js?v=1"></script>
  <script src="js/review.js?v=1"></script>
<script src="js/chess-quest.js?v=5"></script>
<script src="js/chess-extras.js?v=2"></script>
  <script src="js/pwa.js"></script>

</body>
</html>
