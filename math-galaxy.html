<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Galaxy 🧮</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/math-galaxy.css?v=3">
  <link rel="stylesheet" href="css/zs-theme.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7C3AED">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body class="mg-page">
  <div class="app">

    <!-- ============ HOME: galaxy map + worlds ============ -->
    <div class="screen active" id="screen-select">
      <header class="level-header">
        <h1>Math Galaxy</h1>
        <p>Fly from world to world by solving math missions. <span class="greeting" id="greeting"></span></p>
      </header>
      <div class="mg-map-wrap">
        <canvas id="mgMap" class="mg-map" aria-hidden="true"></canvas>
        <div class="mg-map-labels" id="mgMapLabels"></div>
      </div>

      <h2 class="mg-h2">Worlds <span>· Mundos</span></h2>
      <div class="level-grid" id="rankGrid"></div>

      <h2 class="mg-h2">More missions <span>· Más misiones</span></h2>
      <div class="extra-grid">
        <button type="button" class="level-card extra-card card-sprint" onclick="MathExtras.Sprint.open()">
          <span class="extra-icon" data-icon="sprint"></span>
          <span class="rank-body">
            <span class="rank-name">Sprint</span>
            <span class="rank-topics">Times tables · 60 seconds · per-kid best</span>
            <span class="best-badge empty" id="best-sprint">Beat your first time!</span>
          </span>
        </button>
        <button type="button" class="level-card extra-card card-words" onclick="MathExtras.Words.open()">
          <span class="extra-icon" data-icon="words"></span>
          <span class="rank-body">
            <span class="rank-name">Word Problems</span>
            <span class="rank-topics">Real-world math · bilingual · 5 per tier</span>
            <span class="best-badge empty" id="best-words">Try your first problem!</span>
          </span>
        </button>
        <button type="button" class="level-card extra-card card-duel" onclick="MathExtras.Duel.open()">
          <span class="extra-icon" data-icon="duel"></span>
          <span class="rank-body">
            <span class="rank-name">Sibling Duel</span>
            <span class="rank-topics">Pass-and-play · same problems · 60 s each</span>
            <span class="best-badge empty" id="best-duel">Pick two players to begin!</span>
          </span>
        </button>
        <button type="button" class="level-card extra-card card-log" id="card-log">
          <span class="extra-icon" data-icon="log"></span>
          <span class="rank-body">
            <span class="rank-name">Mission Log</span>
            <span class="rank-topics">Every skill you have practised and mastered</span>
            <span class="best-badge empty" id="best-log">Master skills to fill your log</span>
          </span>
        </button>
      </div>
    </div>

    <!-- ============ WORLD (sectors) ============ -->
    <div class="screen" id="screen-rank">
      <div id="rank-wrap" class="rank-wrap"></div>
    </div>

    <!-- ============ SPRINT SCREEN ============ -->
    <div class="screen" id="screen-sprint">
      <div id="sprint-wrap" class="sprint-wrap"></div>
    </div>

    <!-- ============ WORD PROBLEMS SCREEN ============ -->
    <div class="screen" id="screen-words">
      <div id="words-wrap" class="words-wrap"></div>
    </div>

    <!-- ============ DUEL SCREEN ============ -->
    <div class="screen" id="screen-duel">
      <div id="duel-wrap" class="duel-wrap"></div>
    </div>

    <!-- ============ MISSION LOG ============ -->
    <div class="screen" id="screen-log">
      <div id="log-wrap" class="log-wrap"></div>
    </div>

    <!-- ============ GAME SCREEN ============ -->
    <div class="screen" id="screen-game">
      <div class="game-top">
        <button type="button" class="back-btn" id="gameBack" aria-label="Leave this mission"></button>
        <div class="game-title">
          <div class="game-level-badge" id="gameBadge"></div>
          <div class="game-sector" id="gameSector"></div>
        </div>
        <div class="game-combo" id="gameCombo" aria-live="polite"></div>
        <div class="game-score" id="gameScore" aria-label="Score"></div>
      </div>
      <div class="mg-flight-wrap">
        <canvas id="mgFlight" class="mg-flight" aria-hidden="true"></canvas>
        <div class="mg-pips" id="mgPips" role="img"></div>
      </div>
      <div class="question-card" id="questionCard">
        <div class="q-head">
          <div class="question-label" id="qLabel"></div>
          <button type="button" class="q-speak" id="qSpeak" aria-label="Read the question aloud" hidden></button>
        </div>
        <div class="question-text" id="qText"></div>
        <div class="q-vis" id="qVis"></div>
        <div class="question-hint" id="qHint" aria-live="polite"></div>
      </div>
      <div class="answers" id="answersWrap"></div>
      <div class="q-actions">
        <button type="button" class="action-btn btn-secondary hint-btn" id="hintBtn"><i data-icon="hint"></i><span>Show me</span></button>
        <button type="button" class="action-btn btn-primary" id="checkBtn" hidden>Check ✓</button>
        <button type="button" class="action-btn btn-primary" id="nextBtn" hidden>Next ▶</button>
      </div>
    </div>

    <!-- ============ RESULTS SCREEN ============ -->
    <div class="screen" id="screen-results">
      <div class="results-wrap">
        <div class="mg-arrive-wrap"><canvas id="mgArrive" class="mg-arrive" aria-hidden="true"></canvas></div>
        <div class="results-title" id="resultsTitle"></div>
        <div class="results-subtitle" id="resultsSub"></div>
        <div class="stars-row" id="starsRow"></div>
        <div id="newRecordWrap"></div>
        <div class="results-stats" id="resultsStats"></div>
        <div class="results-skills" id="resultsSkills"></div>
        <div class="results-actions">
          <button type="button" class="action-btn btn-primary" id="resultsNext" hidden></button>
          <button type="button" class="action-btn btn-secondary" onclick="playAgain()">Fly again</button>
          <button type="button" class="action-btn btn-secondary" onclick="backToRank()">Sectors</button>
          <button type="button" class="action-btn btn-secondary" onclick="goHome()">Galaxy map</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Feedback overlay -->
  <div class="feedback" id="feedback">
    <span class="feedback-emoji" id="feedbackEmoji"></span>
  </div>

  <script src="js/auth.js?v=7"></script>
  <script src="js/off-hours.js?v=1"></script>

  <script src="js/a11y.js?v=2"></script>
  <script src="js/dialog.js?v=3"></script>
  <script src="js/sync.js?v=19"></script>
  <script src="js/zs-diag.js?v=3"></script>
  <script src="js/nav.js?v=4"></script>
  <script src="js/sounds.js?v=2"></script>
  <script src="js/timer.js?v=3"></script>
  <script src="js/activity-log.js?v=2"></script>
  <script src="js/learning-checks.js?v=5"></script>
  <script src="js/tts.js?v=3"></script>
  <script src="js/speak.js?v=1"></script>
  <script src="js/zs-canvas.js?v=1"></script>
  <script src="js/math-galaxy-art.js?v=2"></script>
  <script src="js/math-galaxy-visuals.js?v=1"></script>
  <script src="js/math-galaxy-data.js?v=1"></script>
  <script src="js/math-galaxy.js?v=4"></script>
  <script src="js/math-extras.js?v=4"></script>
  <script src="js/pwa.js?v=2"></script>
</body>
</html>
