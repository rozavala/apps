<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Wall 🏠</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/family-wall.css?v=3">
  <link rel="stylesheet" href="css/redesign.css?v=3">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7C3AED">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div class="aurora aurora-1"></div>
  <div class="aurora aurora-2"></div>

  <div id="fw-root"></div>

  <div id="fw-loc-modal" class="fw-modal" onclick="if(event.target===this)FamilyWall.closeLocationModal()">
    <div class="fw-modal-card">
      <h2>Set Home Location 📍</h2>
      <p>Used for the weather card. Synced across all family devices.</p>
      <button class="fw-btn fw-btn-primary" onclick="FamilyWall.requestGeo()">📍 Use my current location</button>

      <div class="fw-or">or search for a city</div>
      <div class="fw-loc-search">
        <input type="text" id="fw-loc-query" placeholder="e.g. Antofagasta, Madrid, Buenos Aires"
               onkeydown="if(event.key==='Enter'){event.preventDefault();FamilyWall.runLocationSearch();}" />
        <button class="fw-btn fw-btn-ghost" onclick="FamilyWall.runLocationSearch()">Search</button>
      </div>
      <div id="fw-loc-results" class="fw-loc-results"></div>

      <div class="fw-or">or pick a preset</div>
      <div id="fw-loc-cities" class="fw-loc-cities"></div>

      <div class="fw-modal-btns">
        <button class="fw-btn fw-btn-ghost" onclick="FamilyWall.closeLocationModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="fw-pin-modal" class="fw-modal" onclick="if(event.target===this)FamilyWall.closeParentGate()">
    <div class="fw-modal-card">
      <h2>Parents only 🔒</h2>
      <p id="fw-pin-why">Enter the parent PIN to continue.</p>
      <form onsubmit="return FamilyWall.submitParentPin(event)">
        <label class="fw-sr-only" for="fw-pin-input">Parent PIN</label>
        <input type="password" id="fw-pin-input" class="fw-pin-input" inputmode="numeric"
               maxlength="4" autocomplete="off" placeholder="••••" />
        <div id="fw-pin-error" class="fw-pin-error" role="alert" style="display:none;">Incorrect PIN</div>
        <div class="fw-modal-btns">
          <button type="button" class="fw-btn fw-btn-ghost" onclick="FamilyWall.closeParentGate()">Cancel</button>
          <button type="submit" class="fw-btn fw-btn-primary">Unlock</button>
        </div>
      </form>
    </div>
  </div>

  <div id="fw-routines-modal" class="fw-modal" onclick="if(event.target===this)FamilyWall.closeRoutineEditor()">
    <div class="fw-modal-card fw-modal-wide">
      <h2 id="fw-re-title">Checklists</h2>
      <p>Morning, afternoon and night — each kid has their own three lists. Changes save as you type.</p>
      <div id="fw-re-body"></div>
      <div class="fw-modal-btns">
        <button type="button" class="fw-btn fw-btn-ghost" onclick="FamilyWall.closeRoutineEditor()">Done</button>
      </div>
    </div>
  </div>

  <script src="js/auth.js?v=2"></script>
  <script src="js/a11y.js?v=2"></script>
  <script src="js/sync.js?v=12"></script>
  <script src="js/zs-diag.js?v=3"></script>
  <script src="js/timer.js?v=2"></script>
  <script src="js/activity-log.js?v=2"></script>
  <script src="js/chilean-calendar.js?v=2"></script>
  <script src="js/routines.js?v=6"></script>
  <script src="js/summer-todos.js?v=2"></script>
  <script src="js/family-calendar.js?v=7"></script>
  <script src="js/family-wall.js?v=10"></script>
  <script src="js/pwa.js?v=2"></script>
</body>
</html>
