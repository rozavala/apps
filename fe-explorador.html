  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="fe-body">
  <div class="app fe-app">
    <header class="fe-hero">
      <span class="fe-hero-rose" id="fe-rose" aria-hidden="true"></span>
      <div class="fe-hero-text">
        <h1 class="fe-title">Fe Explorador</h1>
        <p class="fe-sub">Oraciones, santos, rosario y herencia de Chile</p>
      </div>
      <div class="fe-stars" id="star-count" aria-label="Estrellas en Fe Explorador">⭐ 0</div>
    </header>

    <section class="fe-mysaint" id="fe-mysaint" aria-label="Mi santo" hidden></section>

    <nav class="fe-tabs" id="fe-tabs" role="tablist" aria-label="Secciones"></nav>

    <main class="fe-main" id="content-main">
      <!-- Content injected by js/fe-explorador-ui.js -->
    </main>
  </div>
