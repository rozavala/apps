<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fe Explorador — Zavala Serra Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/zs-theme.css">
  <style>
    :root {
      --faith-gold: #F59E0B;
      --faith-gold-light: #FBBF24;
      --faith-gold-ink: #B45309;
      --faith-bg: #f1f1f4;
      --faith-surface: #ffffff;
    }
    body { background-color: var(--faith-bg); color: #1c1b29; }
    
    .header {
      background: var(--faith-surface);
      border-bottom: 2px solid var(--faith-gold);
      padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      background: #ece9f5; border: none; border-radius: 50%;
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      color: #1c1b29; font-size: 20px; cursor: pointer; text-decoration: none;
    }
    .back-btn:hover { background: #d6d2ea; }
    .title { font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.4rem; }
    .stars-badge { color:#fff; background:#B45309; border: 1px solid #B45309; padding: 4px 12px; border-radius: 99px; font-weight: 800; }

    .nav-tabs {
      display: flex; gap: 8px; padding: 12px; overflow-x: auto;
      background: #ece9f5;
    }
    .tab {
      padding: 10px 20px; border-radius: 12px; background: #ffffff;
      font-weight: 700; font-size: 0.9rem; cursor: pointer; white-space: nowrap; transition: all 0.2s;
    }
    .tab.active { background: var(--faith-gold); color: #000; }

    .content-area { padding: 24px; max-width: 600px; margin: 0 auto; min-height: 70vh; }
    .card { background: var(--faith-surface); border-radius: 20px; border: 1.5px solid #e6e6ee; padding: 24px; animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Prayer Section */
    .prayer-line { font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; line-height: 1.4; opacity: 0.4; transition: opacity 0.3s; }
    .prayer-line.active { opacity: 1; color: var(--faith-gold-ink); transform: scale(1.05); transform-origin: left; }
    .bead-counter { display: flex; gap: 8px; justify-content: center; margin-top: 24px; }
    .bead { width: 12px; height: 12px; border-radius: 50%; background: #ece9f5; border: 1px solid #e6e6ee; transition: all 0.3s; }
    .bead.active { background: var(--faith-gold); box-shadow: 0 0 10px var(--faith-gold); }

    /* Saint/Heritage Section */
    .item-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    .item-icon { font-size: 3rem; background: #ece9f5; width: 80px; height: 80px; border-radius: 20px; display: flex; align-items: center; justify-content: center; }
    .item-title { font-family: 'Baloo 2', cursive; font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
    .item-meta { font-size: 0.85rem; color: var(--faith-gold-ink); font-weight: 700; }
    .item-bio { font-size: 1.1rem; line-height: 1.6; margin-bottom: 24px; }

    .quiz-options { display: grid; gap: 12px; }
    .quiz-btn {
      padding: 16px; background: #ffffff; border: 1.5px solid #e6e6ee;
      border-radius: 12px; color: #1c1b29; font-weight: 700; text-align: left; cursor: pointer; transition: all 0.2s;
    }
    .quiz-btn:hover { background: #ece9f5; border-color: var(--faith-gold); }
    .quiz-btn.correct { background: #10B981; border-color: #10B981; }
    .quiz-btn.wrong { background: #EF4444; border-color: #EF4444; }
    .fe-explain {
      margin-top: 12px; padding: 14px 16px; border-radius: 12px;
      background: #fdf6e7; border: 1.5px solid var(--faith-gold);
      color: var(--faith-gold-ink); font-weight: 600; font-size: 0.95rem; line-height: 1.5;
    }

    /* Rosary Section */
    .rosary-today { text-align: center; font-size: 0.95rem; opacity: 0.85; margin: 8px 0 16px; }
    .rosary-today strong { color: var(--faith-gold-ink); }

    .set-tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
    .set-tab {
      padding: 8px 14px; border-radius: 99px; background: #ffffff;
      border: 1.5px solid #d6d2ea; color: #1c1b29; font-weight: 700;
      font-size: 0.85rem; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .set-tab:hover { border-color: var(--faith-gold); }
    .set-tab.active { background: var(--faith-gold); color: #000; border-color: var(--faith-gold); }
    .set-tab.is-today { box-shadow: 0 0 0 2px rgba(245,158,11,0.35); }

    .set-days { text-align: center; font-size: 0.85rem; color: var(--faith-gold-ink); font-weight: 700; margin-bottom: 16px; }

    .mystery-list { display: grid; gap: 8px; margin-bottom: 8px; }
    .mystery-item {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      padding: 12px 14px; border-radius: 12px; background: #ffffff;
      border: 1.5px solid #e6e6ee; color: #1c1b29; cursor: pointer; transition: all 0.2s;
    }
    .mystery-item:hover { border-color: var(--faith-gold); background: #ece9f5; }
    .mystery-item.active { border-color: var(--faith-gold); background: #fdf6e7; }
    .mystery-num {
      flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%;
      background: var(--faith-gold); color: #000; font-weight: 800;
      display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
    }
    .mystery-item.active .mystery-num { box-shadow: 0 0 10px var(--faith-gold); }
    .mystery-item-text { display: flex; flex-direction: column; gap: 2px; }
    .mystery-item-name { font-weight: 800; font-size: 1rem; line-height: 1.2; }
    .mystery-item-desc { font-size: 0.82rem; opacity: 0.75; line-height: 1.35; }

    .rosary-beads { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 32px 0; }
    .rosary-bead { width: 44px; height: 44px; border-radius: 50%; background: #ece9f5; border: 3px solid #d6d2ea; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #6b6878; }
    .rosary-bead.active { background: var(--faith-gold); border-color: #FFF; color: #000; box-shadow: 0 0 20px var(--faith-gold); transform: scale(1.15); }
    .rosary-bead.done { background: #fdf6e7; border-color: var(--faith-gold); color: var(--faith-gold-ink); }

    .mystery-card { background: #ece9f5; padding: 20px; border-radius: 16px; text-align: center; margin-top: 24px; }
    .mystery-title { font-weight: 800; font-size: 1.2rem; color: var(--faith-gold-ink); margin-bottom: 4px; }
    .mystery-desc { font-size: 0.95rem; opacity: 0.8; }

    .bottom-actions { margin-top: 32px; display: flex; justify-content: center; }
    .next-btn {
      padding: 14px 32px; border-radius: 12px; background: linear-gradient(135deg,#4338CA,#6366F1); color: #fff;
      border: none; font-weight: 800; font-family: 'Baloo 2', cursive; font-size: 1.1rem; cursor: pointer;
    }
    .next-btn:hover { transform: scale(1.05); }

    .confetti { position: fixed; pointer-events: none; z-index: 1000; width: 10px; height: 10px; }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7C3AED">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body>
  <div class="header">
    <div class="header-left">
      <a href="index.html" class="back-btn" aria-label="Go back">←</a>
      <div class="title">Fe Explorador ⛪</div>
    </div>
    <div class="stars-badge" id="star-count">⭐ 0</div>
  </div>

  <div class="nav-tabs">
    <div class="tab active" onclick="showTab('prayer')">🙏 Oración</div>
    <div class="tab" onclick="showTab('saint')">😇 Santos</div>
    <div class="tab" onclick="showTab('rosary')">📿 Rosario</div>
    <div class="tab" onclick="showTab('heritage')">🇨🇱 Herencia</div>
  </div>

  <div class="content-area" id="content-main">
    <!-- Content injected by JS -->
  </div>

  <script src="js/auth.js"></script>

  <script src="js/a11y.js"></script>
  <script src="js/sync.js?v=9"></script>
  <script src="js/zs-diag.js?v=3"></script>
  <script src="js/nav.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/activity-log.js"></script>
  <script src="js/learning-checks.js"></script>
  <script src="js/fe-explorador.js"></script>
  <script>
    let currentTab = 'prayer';
    let prayerIndex = 0;
    let prayerLine = 0;
    let saintIndex = 0;
    let rosarySet = null;   // selected mystery set; null = use today's
    let rosaryDecade = 0;   // which of the 5 mysteries (0-4)
    let rosaryStep = 0;     // prayer within the current decade (0-11)
    let rosarySalve = false; // true when showing the closing Salve

    // The prayers prayed in each decade (mystery) of the rosary, in order:
    // 1 Padre Nuestro, 10 Ave Marías, 1 Gloria. After the 5th decade comes
    // the Salve. Kids can read each prayer's text as they pray it.
    const DECADE_PRAYERS = [
      'padrenuestro',
      'avemaria', 'avemaria', 'avemaria', 'avemaria', 'avemaria',
      'avemaria', 'avemaria', 'avemaria', 'avemaria', 'avemaria',
      'gloria'
    ];
    let heritageIndex = 0;

    // Auto-pull sync
    if (typeof CloudSync !== 'undefined' && CloudSync.online) {
      var u = getActiveUser();
      if (u) CloudSync.pull('zs_fe_' + u.name.toLowerCase().replace(/\s+/g, '_'));
    }

    function updateStars() {
      document.getElementById('star-count').textContent = `⭐ ${FeManager.getStatus().totalStars}`;
    }

    function showTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(el => {
        el.classList.toggle('active', el.textContent.toLowerCase().includes(tab.slice(0, 3)));
      });
      render();
    }

    function render() {
      const main = document.getElementById('content-main');
      main.innerHTML = '';
      
      if (currentTab === 'prayer') renderPrayer(main);
      else if (currentTab === 'saint') renderSaint(main);
      else if (currentTab === 'rosary') renderRosary(main);
      else if (currentTab === 'heritage') renderHeritage(main);
      
      updateStars();
    }

    function renderPrayer(container) {
      const p = FeManager.PRAYERS[prayerIndex];
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h2 style="font-family:'Baloo 2';text-align:center;margin-bottom:20px;">${p.title}</h2>
        <div id="prayer-lines">
          ${p.lines.map((l, i) => `<div class="prayer-line ${i === prayerLine ? 'active' : ''}">${l}</div>`).join('')}
        </div>
        <div class="bead-counter">
          ${p.lines.map((_, i) => `<div class="bead ${i <= prayerLine ? 'active' : ''}"></div>`).join('')}
        </div>
        <div class="bottom-actions">
          <button class="next-btn" onclick="nextPrayerLine()">Continuar ➔</button>
        </div>
      `;
      container.appendChild(card);
    }

    function nextPrayerLine() {
      const p = FeManager.PRAYERS[prayerIndex];
      if (prayerLine < p.lines.length - 1) {
        prayerLine++;
        if (typeof playSound === 'function') playSound('click');
      } else {
        FeManager.addStar();
        if (typeof playSound === 'function') playSound('success');
        prayerLine = 0;
        prayerIndex = (prayerIndex + 1) % FeManager.PRAYERS.length;
      }
      render();
    }

    function renderSaint(container) {
      const s = FeManager.SAINTS[saintIndex];
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="item-header">
          <div class="item-icon">😇</div>
          <div>
            <div class="item-title">${s.name}</div>
            <div class="item-meta">${s.dates} • ${s.country}</div>
          </div>
        </div>
        <div class="item-bio">${s.bio}</div>
        <div class="quiz-options">
          <div style="font-weight:800;margin-bottom:8px;">Pregunta: ${s.questions[0].q}</div>
          ${s.questions[0].a.map((opt, i) => `
            <button class="quiz-btn" onclick="checkQuiz(this, ${i === s.questions[0].correct})">${opt}</button>
          `).join('')}
        </div>
      `;
      container.appendChild(card);
    }

    // Returns the quiz object currently shown (saint's first question or
    // heritage item), so we can read an optional `explain` string.
    function currentQuizItem() {
      if (currentTab === 'saint') {
        const s = FeManager.SAINTS[saintIndex];
        return s && s.questions ? s.questions[0] : null;
      }
      if (currentTab === 'heritage') {
        return FeManager.HERITAGE[heritageIndex] || null;
      }
      return null;
    }

    function checkQuiz(btn, isCorrect) {
      if (btn.disabled) return;

      // Show the factual explanation (if any) once an answer is chosen.
      const item = currentQuizItem();
      if (item && item.explain && !btn.parentElement.querySelector('.fe-explain')) {
        const exp = document.createElement('div');
        exp.className = 'fe-explain';
        exp.textContent = item.explain;
        btn.parentElement.appendChild(exp);
      }

      if (isCorrect) {
        btn.classList.add('correct');
        FeManager.addStar();
        if (typeof playSound === 'function') playSound('success');

        const next = () => {
          saintIndex = (saintIndex + 1) % FeManager.SAINTS.length;
          heritageIndex = (heritageIndex + 1) % FeManager.HERITAGE.length;
          render();
        };

        setTimeout(() => {
          if (typeof LearningCheck !== 'undefined') {
            LearningCheck.maybePrompt('faith', next);
          } else {
            next();
          }
        }, 1500);
      } else {
        btn.classList.add('wrong');
        if (typeof playSound === 'function') playSound('error');
      }
      btn.parentElement.querySelectorAll('button').forEach(b => b.disabled = true);
    }

    function renderRosary(container) {
      const today = new Date().getDay();
      const todayIdx = FeManager.getRosarySetIndexForDay(today);
      if (rosarySet === null) rosarySet = todayIdx;

      const sets = FeManager.ROSARY_SETS;
      const set = sets[rosarySet];
      const todaySet = sets[todayIdx];
      const m = set.mysteries[rosaryDecade];
      const dayName = FeManager.DAY_NAMES[today];

      const card = document.createElement('div');
      card.className = 'card';

      const header = `
        <h2 style="font-family:'Baloo 2';text-align:center;">📿 Santo Rosario</h2>
        <p class="rosary-today">Hoy es ${dayName}: se rezan los <strong>${todaySet.name}</strong></p>

        <div class="set-tabs">
          ${sets.map((s, i) => `
            <button class="set-tab ${i === rosarySet ? 'active' : ''} ${i === todayIdx ? 'is-today' : ''}"
                    onclick="selectRosarySet(${i})">
              ${s.emoji} ${s.shortName}${i === todayIdx ? ' · Hoy' : ''}
            </button>
          `).join('')}
        </div>

        <div class="set-days">${set.name} — se rezan ${set.daysLabel}</div>
      `;

      // Closing Salve: shown once after the 5th decade is finished.
      if (rosarySalve) {
        const salve = FeManager.getPrayer('salve');
        card.innerHTML = header + `
          <div class="mystery-card">
            <div class="mystery-title">🎉 ¡Rosario completo!</div>
            <div class="mystery-desc">Para terminar, recemos juntos la Salve.</div>
          </div>
          <h3 style="font-family:'Baloo 2';text-align:center;margin:16px 0 8px;color:var(--faith-gold-ink);">${salve.title}</h3>
          <div id="prayer-lines">
            ${salve.lines.map(l => `<div class="prayer-line active">${l}</div>`).join('')}
          </div>
          <div class="bottom-actions">
            <button class="next-btn" onclick="finishRosary()">¡Terminar! 🌟</button>
          </div>
        `;
        container.appendChild(card);
        return;
      }

      const prayerId = DECADE_PRAYERS[rosaryStep];
      const prayer = FeManager.getPrayer(prayerId);
      // For Ave Marías, show which of the ten we're on (steps 1–10).
      const aveNum = rosaryStep; // step 1 => Ave María 1, ... step 10 => 10
      const prayerLabel = prayerId === 'avemaria'
        ? `${prayer.title} (${aveNum} de 10)`
        : prayer.title;
      const isLastStep = rosaryStep === DECADE_PRAYERS.length - 1;
      const isLastDecade = rosaryDecade === set.mysteries.length - 1;
      const nextLabel = isLastStep
        ? (isLastDecade ? 'Rezar la Salve ➔' : 'Siguiente misterio ➔')
        : 'Continuar ➔';

      card.innerHTML = header + `
        <div class="mystery-list">
          ${set.mysteries.map((my, i) => `
            <button class="mystery-item ${i === rosaryDecade ? 'active' : ''}" onclick="selectDecade(${i})">
              <span class="mystery-num">${i + 1}</span>
              <span class="mystery-item-text">
                <span class="mystery-item-name">${my.name}</span>
                <span class="mystery-item-desc">${my.desc}</span>
              </span>
            </button>
          `).join('')}
        </div>

        <div class="mystery-card">
          <div class="mystery-title">${rosaryDecade + 1}. ${m.name}</div>
          <div class="mystery-desc">${m.desc}</div>
        </div>

        <div class="rosary-beads">
          ${DECADE_PRAYERS.map((id, i) => {
            const label = id === 'padrenuestro' ? 'PN' : (id === 'gloria' ? 'G' : String(i));
            const state = i === rosaryStep ? 'active' : (i < rosaryStep ? 'done' : '');
            return `<div class="rosary-bead ${state}" onclick="goToStep(${i})">${label}</div>`;
          }).join('')}
        </div>

        <h3 style="font-family:'Baloo 2';text-align:center;margin:16px 0 8px;color:var(--faith-gold-ink);">${prayerLabel}</h3>
        <div id="prayer-lines">
          ${prayer.lines.map(l => `<div class="prayer-line active">${l}</div>`).join('')}
        </div>

        <div class="bottom-actions">
          <button class="next-btn" onclick="nextRosaryStep()">${nextLabel}</button>
        </div>
      `;
      container.appendChild(card);
    }

    function selectRosarySet(i) {
      rosarySet = i;
      rosaryDecade = 0;
      rosaryStep = 0;
      rosarySalve = false;
      if (typeof playSound === 'function') playSound('click');
      render();
    }

    function selectDecade(i) {
      rosaryDecade = i;
      rosaryStep = 0;
      rosarySalve = false;
      if (typeof playSound === 'function') playSound('click');
      render();
    }

    // Jump to a specific prayer within the current decade by tapping its bead.
    function goToStep(i) {
      rosaryStep = i;
      if (typeof playSound === 'function') playSound('click');
      render();
    }

    function nextRosaryStep() {
      // Still prayers left in this decade (Padre Nuestro → 10 Aves → Gloria).
      if (rosaryStep < DECADE_PRAYERS.length - 1) {
        rosaryStep++;
        if (typeof playSound === 'function') playSound('click');
        render();
        return;
      }

      // Decade complete — award a star and move on.
      FeManager.addStar();
      if (typeof playSound === 'function') playSound('success');
      rosaryStep = 0;

      const set = FeManager.ROSARY_SETS[rosarySet];
      if (rosaryDecade < set.mysteries.length - 1) {
        rosaryDecade++;
      } else {
        // All five mysteries done — close with the Salve.
        rosarySalve = true;
      }
      render();
    }

    // Finish the full rosary after the closing Salve.
    function finishRosary() {
      FeManager.addStar();
      if (typeof playSound === 'function') playSound('success');
      if (typeof showConfetti === 'function') showConfetti();
      rosarySalve = false;
      rosaryDecade = 0;
      rosaryStep = 0;
      render();
    }

    function renderHeritage(container) {
      const h = FeManager.HERITAGE[heritageIndex];
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="item-header">
          <div class="item-icon">🇨🇱</div>
          <div>
            <div class="item-title">${h.title}</div>
            <div class="item-meta">Herencia de Chile</div>
          </div>
        </div>
        <div class="item-bio">${h.info}</div>
        <div class="quiz-options">
          <div style="font-weight:800;margin-bottom:8px;">Pregunta: ${h.q}</div>
          ${h.a.map((opt, i) => `
            <button class="quiz-btn" onclick="checkQuiz(this, ${i === h.correct})">${opt}</button>
          `).join('')}
        </div>
      `;
      container.appendChild(card);
    }

    // Confetti effect helper
    function showConfetti() {
      for (let i = 0; i < 50; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.background = ['#F59E0B', '#FBBF24', '#FFF', '#7C3AED'][Math.floor(Math.random() * 4)];
        c.style.left = Math.random() * 100 + 'vw';
        c.style.top = '-10px';
        c.style.transform = `rotate(${Math.random() * 360}deg)`;
        document.body.appendChild(c);
        
        const duration = 2000 + Math.random() * 3000;
        c.animate([
          { top: '-10px', opacity: 1 },
          { top: '100vh', opacity: 0, transform: `rotate(${Math.random() * 1000}deg)` }
        ], { duration, easing: 'cubic-bezier(0, .9, .57, 1)' });
        
        setTimeout(() => c.remove(), duration);
      }
    }

    render();
  </script>
  <script src="js/pwa.js"></script>

</body>
</html>
