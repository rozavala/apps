<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible Explorer 📖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/bible-explorer.css?v=3">
  <link rel="stylesheet" href="css/zs-theme.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#818CF8">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div class="app bx-app">
    <!-- SCREEN: Home -->
    <div class="bx-screen active" id="bx-screen-home">
      <div class="bx-header">
        <button type="button" class="bx-lang-toggle" id="bx-lang-toggle" aria-label="Language / Idioma">
          <span id="bx-lang-label">EN / ES</span> 🌐
        </button>
        <div class="bx-hero">
          <div class="bx-hero-art" id="bx-hero-art" aria-hidden="true"></div>
          <div class="bx-hero-text">
            <h1>Bible Explorer</h1>
            <p data-l10n="Stories, verses and the books of Holy Scripture.|Historias, versículos y los libros de la Sagrada Escritura.">Historias, versículos y los libros de la Sagrada Escritura.</p>
          </div>
        </div>
      </div>
      <button type="button" class="bx-review-banner" id="bx-review-banner" hidden></button>
      <div class="bx-tiles">
        <button type="button" class="bx-tile" id="bx-tile-stories">
          <span class="bx-tile-icon" id="bx-ico-stories" aria-hidden="true"></span>
          <div class="bx-tile-title" data-l10n="Stories|Historias">Historias</div>
          <div class="bx-tile-desc" data-l10n="Illustrated stories from the Bible|Historias ilustradas de la Biblia">Stories from the Bible</div>
          <div class="bx-tile-stat" id="bx-stories-stat">0/0</div>
        </button>
        <button type="button" class="bx-tile" id="bx-tile-verses">
          <span class="bx-tile-icon" id="bx-ico-verses" aria-hidden="true"></span>
          <div class="bx-tile-title" data-l10n="Memorise|Memoriza">Memoriza</div>
          <div class="bx-tile-desc" data-l10n="Fill the gap, word order, daily review|Huecos, ordenar palabras, repaso diario">Memorise verses</div>
          <div class="bx-tile-stat" id="bx-verses-stat">0/0</div>
        </button>
        <button type="button" class="bx-tile" id="bx-tile-books">
          <span class="bx-tile-icon" id="bx-ico-books" aria-hidden="true"></span>
          <div class="bx-tile-title" data-l10n="Books|Libros">Libros</div>
          <div class="bx-tile-desc" data-l10n="The bookshelf of the 73 books|La estantería de los 73 libros">Books of the Bible</div>
          <div class="bx-tile-stat" id="bx-books-stat">0/0</div>
        </button>
      </div>
    </div>

    <!-- SCREEN: Stories list -->
    <div class="bx-screen" id="bx-screen-stories">
      <div class="bx-topbar"><button type="button" class="bx-back-btn bx-home-btn" aria-label="Back to home">←</button></div>
      <h2 class="bx-section-title">Historias / Stories</h2>
      <div class="bx-story-grid" id="bx-story-grid"></div>
    </div>

    <!-- SCREEN: Story detail + summary -->
    <div class="bx-screen" id="bx-screen-story-detail">
      <div id="bx-story-detail"></div>
    </div>

    <!-- SCREEN: Story quiz -->
    <div class="bx-screen" id="bx-screen-story-quiz">
      <div class="bx-topbar"><button type="button" class="bx-back-btn" aria-label="Back to stories" onclick="BibleExplorer.backToStoryList()">←</button></div>
      <div class="bx-quiz-card" id="bx-quiz-wrap"></div>
    </div>

    <!-- SCREEN: Story quiz result -->
    <div class="bx-screen" id="bx-screen-story-result">
      <div class="bx-quiz-result" id="bx-quiz-result"></div>
    </div>

    <!-- SCREEN: Verses list -->
    <div class="bx-screen" id="bx-screen-verses">
      <div class="bx-topbar"><button type="button" class="bx-back-btn bx-home-btn" aria-label="Back to home">←</button></div>
      <h2 class="bx-section-title">Memoriza / Memorise</h2>
      <div class="bx-verse-grid" id="bx-verse-grid"></div>
    </div>

    <!-- SCREEN: Verse detail / fill-in-the-blank / word order -->
    <div class="bx-screen" id="bx-screen-verse-detail">
      <div id="bx-verse-detail"></div>
    </div>

    <!-- SCREEN: Books list -->
    <div class="bx-screen" id="bx-screen-books">
      <div class="bx-topbar"><button type="button" class="bx-back-btn bx-home-btn" aria-label="Back to home">←</button></div>
      <h2 class="bx-section-title">Libros / Books</h2>
      <div class="bx-book-grid" id="bx-book-grid"></div>
    </div>

    <!-- SCREEN: Books drill -->
    <div class="bx-screen" id="bx-screen-book-drill">
      <div id="bx-book-drill"></div>
    </div>
  </div>

  <script src="js/auth.js?v=14"></script>
  <script src="js/off-hours.js?v=1"></script>
  <script src="js/a11y.js"></script>
  <script src="js/dialog.js?v=3"></script>
  <script src="js/tts.js?v=3"></script>
  <script src="js/speak.js?v=2"></script>
  <script src="js/sync.js?v=27"></script>
  <script src="js/zs-diag.js?v=3"></script>
  <script src="js/nav.js?v=4"></script>
  <script src="js/sounds.js"></script>
  <script src="js/activity-log.js"></script>
  <script src="js/bible-explorer-art.js?v=1"></script>
  <script src="js/review.js?v=1"></script>
  <script src="js/bible-explorer.js?v=5"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
