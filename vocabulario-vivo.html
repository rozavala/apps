<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocabulario Vivo 📚</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/vocabulario-vivo.css?v=2">
  <link rel="stylesheet" href="css/zs-theme.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F472B6">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div class="atmo" style="width:400px;height:400px;background:rgba(244,114,182,0.10);top:-100px;left:-100px;"></div>
  <div class="atmo" style="width:350px;height:350px;background:rgba(249,115,22,0.06);bottom:-80px;right:-80px;animation-delay:-8s;"></div>

  <div class="app">
    <!-- SCREEN: Home -->
    <div class="vv-screen active" id="vv-screen-home">
      <div class="vv-header">
        <button type="button" class="vv-lang-toggle" id="vv-lang-toggle" aria-label="Switch language / Cambiar idioma">
          <span id="vv-lang-label">EN / ES</span> 🌐
        </button>
        <h1>Vocabulario Vivo</h1>
        <p id="vv-sub">English and Spanish through their Latin and Greek roots.</p>
      </div>
      <div id="vv-daily"></div>
      <div class="vv-tiles">
        <button type="button" class="vv-tile" id="vv-tile-roots">
          <span class="vv-tile-icon" id="vv-ic-roots" aria-hidden="true"></span>
          <span class="vv-tile-title">Raíces</span>
          <span class="vv-tile-desc" id="vv-desc-roots">Grow a word tree from each root</span>
          <span class="vv-tile-foot"><span class="vv-tile-stat" id="vv-roots-stat">0/0</span><span class="vv-tile-stars"></span></span>
        </button>
        <button type="button" class="vv-tile" id="vv-tile-match">
          <span class="vv-tile-icon" id="vv-ic-match" aria-hidden="true"></span>
          <span class="vv-tile-title">Empareja</span>
          <span class="vv-tile-desc" id="vv-desc-match">Which root is in the word?</span>
          <span class="vv-tile-foot"><span class="vv-tile-stat" id="vv-match-stat">0 best</span><span class="vv-tile-stars"></span></span>
        </button>
        <button type="button" class="vv-tile" id="vv-tile-build">
          <span class="vv-tile-icon" id="vv-ic-build" aria-hidden="true"></span>
          <span class="vv-tile-title">Construye</span>
          <span class="vv-tile-desc" id="vv-desc-build">Snap wood tiles into a word</span>
          <span class="vv-tile-foot"><span class="vv-tile-stat" id="vv-build-stat">0/0</span><span class="vv-tile-stars"></span></span>
        </button>
        <button type="button" class="vv-tile" id="vv-tile-dictation">
          <span class="vv-tile-icon" id="vv-ic-dictation" aria-hidden="true"></span>
          <span class="vv-tile-title">Dictado</span>
          <span class="vv-tile-desc" id="vv-desc-dictation">Read the meaning, spell the word</span>
          <span class="vv-tile-foot"><span class="vv-tile-stat" id="vv-dictation-stat">0 best</span><span class="vv-tile-stars"></span></span>
        </button>
        <button type="button" class="vv-tile" id="vv-tile-spot">
          <span class="vv-tile-icon" id="vv-ic-spot" aria-hidden="true"></span>
          <span class="vv-tile-title">Detective</span>
          <span class="vv-tile-desc" id="vv-desc-spot">Find the root in a sentence</span>
          <span class="vv-tile-foot"><span class="vv-tile-stat" id="vv-spot-stat">0 best</span><span class="vv-tile-stars"></span></span>
        </button>
        <button type="button" class="vv-tile" id="vv-tile-cog">
          <span class="vv-tile-icon" id="vv-ic-cog" aria-hidden="true"></span>
          <span class="vv-tile-title">Cognados</span>
          <span class="vv-tile-desc" id="vv-desc-cog">Pair English and Spanish twins</span>
          <span class="vv-tile-foot"><span class="vv-tile-stat" id="vv-cog-stat">0% best</span><span class="vv-tile-stars"></span></span>
        </button>
      </div>
    </div>

    <!-- SCREEN: Roots list -->
    <div class="vv-screen" id="vv-screen-roots">
      <button type="button" class="vv-back-btn vv-home-btn" aria-label="Back to home">←</button>
      <h2 class="vv-section-title" id="vv-roots-title">Roots</h2>
      <div class="vv-tier-bar">
        <button type="button" class="vv-tier-filter vv-active" data-tier="all">Todas / All</button>
        <button type="button" class="vv-tier-filter" data-tier="1"><i class="vv-pip on"></i> 6-7</button>
        <button type="button" class="vv-tier-filter" data-tier="2"><i class="vv-pip on"></i><i class="vv-pip on"></i> 8-9</button>
        <button type="button" class="vv-tier-filter" data-tier="3"><i class="vv-pip on"></i><i class="vv-pip on"></i><i class="vv-pip on"></i> 10+</button>
      </div>
      <div class="vv-root-grid" id="vv-root-grid"></div>
    </div>

    <!-- SCREEN: Root detail -->
    <div class="vv-screen" id="vv-screen-root-detail">
      <div id="vv-root-detail"></div>
    </div>

    <!-- SCREEN: Match -->
    <div class="vv-screen" id="vv-screen-match">
      <button type="button" class="vv-back-btn vv-home-btn" aria-label="Back to home">←</button>
      <div id="vv-match-wrap"></div>
    </div>

    <!-- SCREEN: Match result -->
    <div class="vv-screen" id="vv-screen-match-result">
      <div id="vv-match-result"></div>
    </div>

    <!-- SCREEN: Build -->
    <div class="vv-screen" id="vv-screen-build">
      <button type="button" class="vv-back-btn vv-home-btn" aria-label="Back to home">←</button>
      <div id="vv-build-wrap"></div>
    </div>

    <!-- SCREEN: Dictation -->
    <div class="vv-screen" id="vv-screen-dictation">
      <button type="button" class="vv-back-btn vv-home-btn" aria-label="Back to home">←</button>
      <div id="vv-dictation-wrap"></div>
    </div>

    <!-- SCREEN: Dictation result -->
    <div class="vv-screen" id="vv-screen-dictation-result">
      <div id="vv-dictation-result"></div>
    </div>

    <!-- SCREEN: Detective (spot the root) -->
    <div class="vv-screen" id="vv-screen-spot">
      <button type="button" class="vv-back-btn vv-home-btn" aria-label="Back to home">←</button>
      <div id="vv-spot-wrap"></div>
    </div>

    <!-- SCREEN: Cognados -->
    <div class="vv-screen" id="vv-screen-cognates">
      <button type="button" class="vv-back-btn vv-home-btn" aria-label="Back to home">←</button>
      <div id="vv-cog-wrap"></div>
    </div>

    <!-- SCREEN: Result (Detective, Cognados) -->
    <div class="vv-screen" id="vv-screen-result">
      <div id="vv-result"></div>
    </div>
  </div>

  <script src="js/auth.js?v=7"></script>
  <script src="js/off-hours.js?v=1"></script>
  <script src="js/a11y.js"></script>
  <script src="js/dialog.js?v=3"></script>
  <script src="js/tts.js?v=3"></script>
  <script src="js/speak.js?v=2"></script>
  <script src="js/sync.js?v=19"></script>
  <script src="js/zs-diag.js?v=3"></script>
  <script src="js/nav.js?v=4"></script>
  <script src="js/sounds.js"></script>
  <script src="js/activity-log.js"></script>
  <script src="js/vocabulario-vivo-data.js?v=1"></script>
  <script src="js/vocabulario-vivo-art.js?v=1"></script>
  <script src="js/review.js?v=1"></script>
  <script src="js/vocabulario-vivo.js?v=4"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
